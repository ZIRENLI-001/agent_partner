limit_req_zone $binary_remote_addr zone=agent_partner_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=agent_partner_status:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name agentpartner.top www.agentpartner.top;
    return 301 https://agentpartner.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name 163.7.11.194;
    return 301 https://163.7.11.194$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.agentpartner.top;

    ssl_certificate /etc/letsencrypt/live/agentpartner.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentpartner.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    return 301 https://agentpartner.top$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agentpartner.top;

    ssl_certificate /etc/letsencrypt/live/agentpartner.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentpartner.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 10m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location ~ "^/api/runs/run_[0-9a-f]{8}/status$" {
        limit_req zone=agent_partner_status burst=30 nodelay;
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/stages/ {
        limit_req zone=agent_partner_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
    }

    location /api/ {
        limit_req zone=agent_partner_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

