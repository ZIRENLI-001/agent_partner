<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美团履约评测工作台</title>
    <style>
      :root {
        color-scheme: light;
        --mt-yellow: #FFD100;
        --mt-yellow-dark: #e6b800;
        --ink: #111111;
        --ink-muted: #5f6368;
        --line: #e6e8eb;
        --surface: #ffffff;
        --surface-soft: #f7f8fa;
        --success: #188038;
        --danger: #d93025;
        --warning: #b06000;
        --focus: rgba(255, 209, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--surface-soft);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 72px minmax(0, 1fr) 72px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 28px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: var(--mt-yellow);
        color: var(--ink);
        font-size: 22px;
        font-weight: 800;
      }

      .brand-title {
        font-size: 18px;
        font-weight: 800;
        line-height: 1.2;
      }

      .brand-subtitle {
        margin-top: 3px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .run-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink-muted);
        background: #fafafa;
        font-size: 13px;
        white-space: nowrap;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ink-muted);
      }

      .status-dot.idle {
        background: var(--mt-yellow-dark);
      }

      .workspace {
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
        min-height: 0;
      }

      .app-shell.sidebar-collapsed .workspace {
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .app-shell:not(.wizard-view) {
        grid-template-rows: 72px minmax(0, 1fr);
      }

      .app-shell:not(.wizard-view) .step-rail,
      .app-shell:not(.wizard-view) .actionbar {
        display: none;
      }

      .global-nav {
        display: grid;
        align-content: start;
        gap: 10px;
        justify-items: stretch;
        padding: 18px 14px;
        background: #ffffff;
        border-right: 1px solid var(--line);
      }

      .nav-toggle {
        justify-self: end;
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink-muted);
        font-size: 20px;
        line-height: 1;
        font-weight: 800;
        padding: 0;
      }

      .nav-toggle:hover {
        background: #fafafa;
      }

      .nav-section-label {
        margin: 10px 10px 4px;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 800;
      }

      .nav-product {
        margin: 0 8px 10px;
        padding: 12px;
        border: 1px solid #efe2a4;
        border-radius: 8px;
        background: #fff9d9;
        color: var(--ink);
      }

      .nav-product strong {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .nav-product span {
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .global-nav-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-muted);
        padding: 0 10px;
        text-align: left;
      }

      .global-nav-icon {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #f1f3f4;
        color: #7a5c00;
        font-size: 12px;
        font-weight: 900;
      }

      .global-nav-item:hover {
        background: #fafafa;
      }

      .global-nav-item:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .global-nav-item.active {
        border-color: #f0d262;
        border-left: 4px solid var(--mt-yellow);
        background: #fff7cc;
        color: var(--ink);
        font-weight: 800;
      }

      .global-nav-note {
        margin: 16px 10px 0;
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .app-shell.sidebar-collapsed .global-nav {
        padding: 18px 10px;
      }

      .app-shell.sidebar-collapsed .nav-toggle {
        justify-self: center;
      }

      .app-shell.sidebar-collapsed .nav-product,
      .app-shell.sidebar-collapsed .nav-section-label,
      .app-shell.sidebar-collapsed .global-nav-note,
      .app-shell.sidebar-collapsed .global-nav-label {
        display: none;
      }

      .app-shell.sidebar-collapsed .global-nav-item {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 0;
      }

      .app-shell.sidebar-collapsed .global-nav-item.active {
        border-left-width: 1px;
      }

      .main-workspace {
        min-width: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr);
      }

      .wizard-layout {
        min-height: 0;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .app-shell:not(.wizard-view) .wizard-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .step-rail {
        padding: 20px 16px;
        background: var(--surface);
        border-right: 1px solid var(--line);
        overflow: auto;
      }

      .step-item {
        width: 100%;
        height: 44px;
        margin-bottom: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-muted);
        text-align: left;
        padding: 0 12px;
      }

      .step-item:hover {
        background: #fafafa;
      }

      .step-item:focus-visible,
      .primary-button:focus-visible,
      .secondary-button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .step-item.active {
        background: #fff7cc;
        border-color: var(--mt-yellow);
        color: var(--ink);
        font-weight: 700;
      }

      .step-item.done::after {
        content: "完成";
        float: right;
        color: var(--success);
        font-size: 12px;
        font-weight: 600;
      }

      .step-item.ready {
        color: var(--ink);
      }

      .step-item.running::after {
        content: "执行中";
        float: right;
        color: var(--warning);
        font-size: 12px;
        font-weight: 600;
      }

      .step-item.locked {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .stage {
        min-width: 0;
        padding: 20px;
        overflow: auto;
      }

      .home-dashboard {
        max-width: 1180px;
        min-height: calc(100vh - 112px);
        display: grid;
        grid-template-rows: auto;
        gap: 12px;
      }

      .compact-home {
        align-content: start;
      }

      .stage-panel {
        max-width: 1040px;
        min-height: 460px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
      }

      .stage-panel.wide {
        max-width: 1180px;
      }

      .home-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        align-items: stretch;
      }

      .home-hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 12px;
        min-height: 360px;
      }

      .home-hero-main {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 28px 32px;
      }

      .home-hero-main {
        background:
          linear-gradient(135deg, rgba(255, 209, 0, 0.36), rgba(255, 255, 255, 0) 52%),
          #ffffff;
      }

      .home-hero-main h1 {
        margin: 10px 0;
        font-size: 30px;
        line-height: 1.2;
      }

      .home-hero-main p {
        margin: 0;
        color: var(--ink-muted);
        font-size: 16px;
        line-height: 1.62;
      }

      .home-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .home-actions .primary-button,
      .home-actions .secondary-button {
        width: auto;
        padding: 0 16px;
      }

      .home-action-button {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        transition: background-color 0.16s ease, border-color 0.16s ease;
      }

      .home-action-button:hover {
        border-color: var(--mt-yellow-dark);
        background: var(--mt-yellow);
      }

      .home-icon {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #fff7cc;
        color: #7a5c00;
        vertical-align: middle;
      }

      .home-icon svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .card-title-row,
      .capability-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .home-capability-grid {
        display: grid;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .capability-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
      }

      .capability-card strong {
        display: block;
        font-size: 14px;
      }

      .capability-card span {
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .workflow-strip {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 10px;
      }

      .workflow-node {
        min-width: 0;
        border: 1px solid #edf0f2;
        border-radius: 8px;
        background: #fafafa;
        padding: 10px;
      }

      .workflow-node span {
        display: block;
        margin-bottom: 5px;
        color: var(--warning);
        font-size: 12px;
        font-weight: 900;
      }

      .workflow-node strong {
        display: block;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.35;
      }

      .mode-card {
        display: grid;
        align-content: start;
        grid-template-rows: auto auto auto auto;
        min-height: 118px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
        text-align: left;
      }

      .mode-card h2 {
        margin: 0;
        font-size: 16px;
      }

      .mode-card p,
      .mode-card li {
        color: var(--ink-muted);
        line-height: 1.45;
      }

      .home-card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 12px;
      }

      .home-card-tags span {
        border-radius: 999px;
        background: #fafafa;
        color: var(--ink-muted);
        padding: 4px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .mode-card .home-action-button {
        align-self: end;
        width: 100%;
      }

      .context-row,
      .top-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 18px;
      }

      .context-chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 10px;
        background: #fafafa;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .history-list {
        display: grid;
        gap: 8px;
      }

      .history-panel {
        max-width: 1180px;
        min-height: calc(100vh - 112px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      .history-panel .stage-heading {
        margin-bottom: 14px;
      }

      .history-panel .stage-heading h1 {
        margin: 4px 0;
        font-size: 20px;
      }

      .history-panel .stage-heading p {
        line-height: 1.5;
      }

      .history-page-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }

      .history-page-indicator {
        color: var(--ink-muted);
        font-size: 13px;
        font-weight: 800;
      }

      .history-row {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) minmax(0, 1.3fr) 110px 120px;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 10px 12px;
      }

      .stage-kicker {
        color: var(--warning);
        font-size: 13px;
        font-weight: 700;
      }

      .stage-title {
        margin: 8px 0 6px;
        font-size: 20px;
        line-height: 1.2;
      }

      .stage-copy {
        max-width: 720px;
        margin: 0 0 22px;
        color: var(--ink-muted);
        line-height: 1.7;
      }

      .stage-heading {
        margin-bottom: 22px;
      }

      .stage-heading h1 {
        margin: 8px 0 6px;
        font-size: 21px;
        line-height: 1.2;
      }

      .stage-heading p {
        max-width: 760px;
        margin: 0;
        color: var(--ink-muted);
        line-height: 1.7;
      }

      .eyebrow {
        color: var(--warning) !important;
        font-size: 13px;
        font-weight: 800;
      }

      .section-title {
        margin-bottom: 10px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
      }

      .empty-state {
        min-height: 360px;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 10px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: #fafafa;
        padding: 32px;
      }

      .empty-state h1 {
        margin: 0;
        font-size: 21px;
      }

      .empty-state p {
        max-width: 560px;
        margin: 0;
        color: var(--ink-muted);
        line-height: 1.7;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .field label {
        font-size: 13px;
        font-weight: 700;
      }

      .input,
      .textarea,
      select.input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        padding: 0 12px;
      }

      .textarea {
        min-height: 128px;
        resize: vertical;
        padding: 12px;
        line-height: 1.55;
      }

      .textarea.tall {
        min-height: 300px;
      }

      .input:focus,
      .textarea:focus {
        border-color: var(--mt-yellow-dark);
        outline: 3px solid var(--focus);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fafafa;
      }

      .metric span {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .metric strong {
        font-size: 20px;
      }

      .list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .list-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
      }

      .list-item h3 {
        margin: 0 0 8px;
        font-size: 15px;
      }

      .list-item p {
        margin: 0;
        color: var(--ink-muted);
        line-height: 1.6;
      }

      .list-item + .section-title,
      .list + .section-title {
        margin-top: 20px;
      }

      .split-pane {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
      }

      .trace-pane,
      .result-pane {
        min-height: 360px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 14px;
        overflow: auto;
      }

      .evidence-chain {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .scenario-list {
        display: grid;
        gap: 10px;
      }

      .check-row {
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
      }

      .check-row input {
        margin-top: 3px;
      }

      .check-row strong {
        display: block;
        margin-bottom: 5px;
      }

      .check-row span {
        display: block;
        color: var(--ink-muted);
        line-height: 1.55;
      }

      .report-preview,
      .markdown-report {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      .markdown-report {
        white-space: pre-wrap;
        line-height: 1.7;
      }

      .run-scenario-list,
      .report-stack {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }

      .scenario-report-panel,
      .report-section {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 14px;
        min-width: 0;
      }

      .scenario-report-panel h2,
      .report-section h2 {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.35;
      }

      .scenario-accordion {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        overflow: hidden;
      }

      .scenario-accordion + .scenario-accordion {
        margin-top: 10px;
      }

      .scenario-accordion summary {
        list-style: none;
        cursor: pointer;
        padding: 14px;
      }

      .scenario-accordion summary::-webkit-details-marker {
        display: none;
      }

      .scenario-accordion summary::after {
        content: "展开";
        float: right;
        margin-top: 2px;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 800;
      }

      .scenario-accordion[open] summary::after {
        content: "收起";
      }

      .scenario-accordion-body {
        border-top: 1px solid var(--line);
        padding: 14px;
        background: #fafafa;
      }

      .result-summary-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: center;
        min-width: 0;
      }

      .result-summary-title {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 800;
      }

      .report-details {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        padding: 14px;
      }

      .report-details summary {
        cursor: pointer;
        font-weight: 800;
      }

      .scenario-pair {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: 14px;
      }

      .trace-header,
      .result-header,
      .compact-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .trace-header,
      .result-header {
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .trace-title,
      .result-title {
        min-width: 0;
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 800;
      }

      .turn-list,
      .evidence-list,
      .dimension-list,
      .failure-list,
      .matrix-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .turn-row {
        display: grid;
        grid-template-columns: 104px minmax(0, 1fr);
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fafafa;
      }

      .turn-meta {
        display: grid;
        align-content: start;
        gap: 4px;
        min-width: 0;
      }

      .turn-speaker {
        font-size: 12px;
        font-weight: 800;
        color: var(--ink);
      }

      .turn-id,
      .meta-text {
        color: var(--ink-muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .turn-content,

    <script>
      const steps = ["model", "data", "parse", "rubric", "scenarios", "run", "report"];
      const stepLabels = {
        model: "评测模型",
        data: "导入数据与场景",
        parse: "指令解析",
        rubric: "Rubric 生成",
        scenarios: "测试场景",
        run: "轨迹与结果",
        report: "可视化报告",
      };

      const stageRoot = document.querySelector("#stage-root");
      const appShell = document.querySelector(".app-shell");
      const prevButton = document.querySelector("#prev-button");
      const nextButton = document.querySelector("#next-button");
      const actionHint = document.querySelector("#action-hint");
      const runStatusDot = document.querySelector("#run-status-dot");
      const runStatusText = document.querySelector("#run-status-text");
      const contextStatus = document.querySelector("#context-status");
      const navToggle = document.querySelector("#nav-toggle");
      const globalNavItems = document.querySelectorAll("[data-global-view]");

      const state = {
        activeView: "home",
        activeStep: "model",
        sidebarCollapsed: false,
        completed: new Set(),
        generatedSteps: new Set(),
        context: {
          user: {user_id: "demo_user"},
          workspace: {workspace_id: "workspace_demo"},
          project: {project_id: "project_meituan_fulfillment"},
        },
        modelConfig: {
          provider: "openai_compatible",
          model_name: "",
          api_base: "",
          api_key: "",
          judge_mode: "hybrid",
        },
        instruction: "",
        inputData: "",
        sampleTasks: [],
        selectedScenarioIds: new Set(),
        calibrationNotes: {
          parse: "",
          rubric: "",
          scenarios: "",
          run: "",
          report: "",
        },
        parseResult: null,
        rubricResult: null,
        scenarioResult: null,
        runResult: null,
        quickRunResult: null,
        history: [],
        historyPage: 1,
        historyPageSize: 5,
        historyDetail: null,
        isRunning: false,
        error: "",
      };

      const hints = {
        model: "点击生成保存当前模型配置；保存后点击下一步进入数据导入。",
        data: "点击生成保存当前任务指令和评测数据；保存后点击下一步进入指令解析。",
        parse: "点击生成产出当前指令解析结果；确认后点击下一步进入 Rubric。",
        rubric: "点击生成产出当前 Rubric；确认评分项后点击下一步进入测试场景。",
        scenarios: "点击生成产出当前测试场景；选择场景后点击下一步进入运行阶段。",
        run: "点击生成运行评测并产出轨迹与结果；检查后点击下一步进入最终报告。",
        report: "汇总最终可视化报告，便于复盘和提交。",
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function displayValue(value) {
        if (Array.isArray(value)) return value.filter(Boolean).join("、");
        if (value && typeof value === "object") {
          return Object.entries(value)
            .map(([key, entry]) => `${key}: ${displayValue(entry)}`)
            .join("；");
        }
        return value ?? "";
      }

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          let message = `请求失败：${response.status}`;
          const text = await response.text();
          try {
            const data = JSON.parse(text);
            message = data.detail || data.message || JSON.stringify(data);
          } catch {
            if (text) message = text;
          }
          throw new Error(message);
        }
        return response.json();
      }

      async function getJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`请求失败：${response.status}`);
        }
        return response.json();
      }

      function switchView(view) {
        state.activeView = view;
        state.error = "";
        renderShell();
        if (view === "home") renderHome();
        if (view === "quick") renderQuickRun();
        if (view === "wizard") renderStep();
        if (view === "history") renderHistory();
      }

      async function loadContext() {
        try {
          state.context = await getJson("/api/context");
        } catch {
          state.context = {
            user: {user_id: "demo_user"},
            workspace: {workspace_id: "workspace_demo"},
            project: {project_id: "project_meituan_fulfillment"},
          };
        }
        contextStatus.textContent = "评测记录按项目隔离保存";
      }

      function stepIndex(step) {
        return steps.indexOf(step);
      }

      function canOpenStep(step) {
        const index = stepIndex(step);
        return step === "model" || state.completed.has(steps[index - 1]) || state.completed.has(step);
      }

      function clearArtifactsFrom(step) {
        const index = stepIndex(step);
        steps.slice(index).forEach((item) => {
          state.generatedSteps.delete(item);
          state.completed.delete(item);
        });
        if (index <= stepIndex("parse")) state.parseResult = null;
        if (index <= stepIndex("rubric")) state.rubricResult = null;
        if (index <= stepIndex("scenarios")) {
          state.scenarioResult = null;
          state.selectedScenarioIds = new Set();
        }
        if (index <= stepIndex("run")) state.runResult = null;
      }

      function invalidateFrom(step) {
        clearArtifactsFrom(step);
        document.querySelectorAll(".success-banner").forEach((item) => item.remove());
        renderShell();
      }

      function setActiveStep(step) {
        if (!canOpenStep(step)) return;
        state.activeStep = step;
        state.error = "";
        renderShell();
        renderStep();
      }

      function moveToStep(step) {
        if (!canOpenStep(step) || step === state.activeStep || state.isRunning) return;
        try {
          validateBeforeLeavingStep(step);
          setActiveStep(step);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      }

      function completeStep(step) {
        state.completed.add(step);
        const next = steps[stepIndex(step) + 1];
        if (next) setActiveStep(next);
        else renderShell();
      }

      function markStepGenerated(step) {
        state.generatedSteps.add(step);
        state.error = "";
        renderShell();
        renderStep();
      }

      function saveCalibrationNote(step) {
        const field = document.querySelector(`[data-note-step="${step}"]`);
        if (field) state.calibrationNotes[step] = field.value;
      }

      async function regenerateStep(step) {
        saveCalibrationNote(step);
        setRunning(true);
        try {
          clearArtifactsFrom(step);
          if (step === "parse") await executeParseStage();
          if (step === "rubric") await executeRubricStage();
          if (step === "scenarios") await executeScenariosStage();
          if (step === "run") await executeRunStage();
          if (step === "report") {
            state.error = "";
            renderReportStep();
            return;
          }
          markStepGenerated(step);
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        } finally {
          setRunning(false);
        }
      }

      function wireReviewControls() {
        document.querySelectorAll("[data-note-step]").forEach((field) => {
          field.addEventListener("input", () => {
            state.calibrationNotes[field.dataset.noteStep] = field.value;
          });
        });
        document.querySelectorAll("[data-regenerate-step]").forEach((button) => {
          button.addEventListener("click", () => regenerateStep(button.dataset.regenerateStep));
        });
      }

      function setRunning(flag) {
        state.isRunning = flag;
        renderShell();
      }

      function showError(message) {
        state.error = message;
        renderStep();
      }

      function stagePayload() {
        return {
          instruction: state.instruction,
          input_data: state.inputData,
          minimum_scenarios: 5,
        };
      }

      function runContextPayload() {
        return {
          workspace_id: state.context.workspace?.workspace_id || "workspace_demo",
          project_id: state.context.project?.project_id || "project_meituan_fulfillment",
          created_by: state.context.user?.user_id || "demo_user",
        };
      }

      function readModelForm() {
        state.modelConfig = {
          provider: document.querySelector("#provider")?.value || "openai_compatible",
          model_name: document.querySelector("#model-name")?.value.trim() || "",
          api_base: document.querySelector("#api-base")?.value.trim() || "",
          api_key: document.querySelector("#api-key")?.value || "",
          judge_mode: document.querySelector("#judge-mode")?.value || "hybrid",
        };
      }

      function readDataForm() {
        state.instruction = document.querySelector("#instruction-input")?.value || "";
        state.inputData = document.querySelector("#input-data")?.value || "";
      }

      function validateCurrentStep() {
        const currentInstruction = document.querySelector("#instruction-input")?.value ?? state.instruction;
        if (state.activeStep === "data" && !currentInstruction.trim()) {
          throw new Error("请先输入任务指令，或加载美团履约样例。");
        }
        if (
          (state.activeStep === "scenarios" || state.activeStep === "run") &&
          state.scenarioResult &&
          state.selectedScenarioIds.size === 0
        ) {
          throw new Error("请至少选择一个测试场景。");
        }
      }

      function validateBeforeLeavingStep(targetStep) {
        if (state.activeStep === "data") readDataForm();
        validateCurrentStep();
        if (stepIndex(targetStep) >= stepIndex("run") && state.scenarioResult && state.selectedScenarioIds.size === 0) {
          throw new Error("请至少选择一个测试场景。");
        }
      }

      async function loadSampleTasks() {
        const response = await fetch("/api/sample-tasks");
        if (!response.ok) {
          let message = "无法加载 Excel 样例";
          const text = await response.text();
          try {
            const data = JSON.parse(text);
            message = data.detail || data.message || message;
          } catch {
            if (text) message = text;
          }
          throw new Error(message);
        }
        const data = await response.json();
        state.sampleTasks = data.tasks || [];
        if (!state.sampleTasks[0]) throw new Error("未找到可用的美团履约样例。");
        state.instruction = state.sampleTasks[0].instruction;
        const instructionInput = document.getElementById("instruction-input");
        if (instructionInput) instructionInput.value = state.instruction;
      }

      async function executeParseStage() {
        state.parseResult = await postJson("/api/stages/parse", stagePayload());
      }

      async function executeRubricStage() {
        state.rubricResult = await postJson("/api/stages/rubric", stagePayload());
      }

      async function executeScenariosStage() {
        state.scenarioResult = await postJson("/api/stages/scenarios", stagePayload());
        const scenarios = state.scenarioResult?.scenario_set?.scenarios || [];
        state.selectedScenarioIds = new Set(
          scenarios.map((scenario) => scenario.scenario_id || scenario.id).filter(Boolean)
        );
      }

      async function executeRunStage() {
        state.runResult = await postJson("/api/runs", {
          ...stagePayload(),
          model_config: state.modelConfig,
          selected_scenario_ids: Array.from(state.selectedScenarioIds),
          ...runContextPayload(),
        });
        if (state.runResult.task_spec) {
          state.parseResult = {
            stage: "parse",
            task_spec: state.runResult.task_spec,
            input_data_summary: state.runResult.input_data_summary,
          };
        }
        if (state.runResult.rubric_spec) {
          state.rubricResult = {
            stage: "rubric",
            task_spec: state.runResult.task_spec,
            rubric_spec: state.runResult.rubric_spec,
          };
        }
        if (state.runResult.scenario_set) {
          state.scenarioResult = {
            stage: "scenarios",
            task_spec: state.runResult.task_spec,
            rubric_spec: state.runResult.rubric_spec,
            scenario_set: state.runResult.scenario_set,
          };
        }
      }

        const activeGlobalView = state.activeView === "quick" ? "home" : state.activeView;

          button.classList.toggle("active", button.dataset.globalView === activeGlobalView);
          button.disabled = state.isRunning && button.dataset.globalView !== state.activeView;
        });
        document.querySelectorAll(".step-item").forEach((button) => {
          const step = button.dataset.step;
          button.classList.toggle("active", step === state.activeStep);
          button.classList.toggle("done", state.completed.has(step));
          button.classList.toggle("locked", !canOpenStep(step));
          button.classList.toggle("ready", canOpenStep(step) && step !== state.activeStep && !state.completed.has(step));
          button.classList.toggle("running", state.isRunning && step === state.activeStep);
          button.disabled = !canOpenStep(step) || state.isRunning;
        });

        prevButton.disabled = state.isRunning || stepIndex(state.activeStep) === 0;
        nextButton.disabled = state.isRunning;
        if (state.activeStep !== "report" && state.generatedSteps.has(state.activeStep)) {

      function renderTaskSpec(spec) {
        const requiredSteps = spec.required_steps || [];

        const edgeCases = spec.edge_cases || [];
        return `

            <div class="section-title">FAQ</div>

              const intent = item.intent || item.question || "FAQ";
              const answer = item.expected_answer || item.answer || displayValue(item);
              return `<li class="list-item"><h3>${escapeHtml(intent)}</h3><p>${escapeHtml(answer)}</p></li>`;
            }).join("")}</ul>
            <div class="section-title">Edge Cases</div>
            <ul class="list">${edgeCases.map((item) => {
              if (typeof item === "string") return `<li class="list-item">${escapeHtml(item)}</li>`;
              const trigger = item.trigger || item.name || "异常分支";
              const expected = item.expected_behavior || item.behavior || displayValue(item);
              return `<li class="list-item"><h3>${escapeHtml(trigger)}</h3><p>${escapeHtml(expected)}</p></li>`;
            }).join("")}</ul>
            ${renderReviewPanel("parse", "人工校准入口", "业务专家可记录解析修正意见；重新生成会使 Rubric、场景、运行结果和报告失效。", "重新生成解析结果")}
          </div>
        `;
      }

      function renderRubric(rubric) {
        const items = rubric.items || [];
        return `
          <div class="stage-panel">
            ${renderError()}
            <div class="stage-heading">

                  <p>权重：${escapeHtml(item.weight ?? "未设置")} · 判定：${escapeHtml(item.judgement || item.method || item.description || "等待规则补全")}</p>
                </li>
              `).join("")}
            </ul>
            ${renderReviewPanel("rubric", "人工校准入口", "可记录权重、评分项或规则口径的复核意见；重新生成会使场景、运行结果和报告失效。", "重新生成 Rubric")}
          </div>
        `;
      }

      function renderScenarios(scenarios) {
        return `
          <div class="stage-panel">
            ${renderError()}
            <div class="stage-heading">
              <p class="eyebrow">Step 5 / 7 · ${stepLabels.scenarios}</p>
              <h1>测试场景</h1>
              <p>选择要进入运行阶段的用户模拟场景，覆盖履约外呼中的常见分支。</p>
            </div>
            <div class="scenario-list">
              ${scenarios.map((scenario) => {
                const id = scenario.scenario_id || scenario.id || scenario.name;
                const checked = state.selectedScenarioIds.has(id) ? "checked" : "";
                const targets = scenario.coverage_targets || [];
                const profile = displayValue(scenario.user_profile);
                return `
                  <label class="check-row">
                    <input type="checkbox" data-scenario-id="${escapeHtml(id)}" ${checked} />
                    <span>
                      <strong>${escapeHtml(scenario.name || id)}</strong>
                      <span>用户画像：${escapeHtml(profile || scenario.description || "未提供")}</span>
                      <span>初始意图：${escapeHtml(scenario.initial_user_intent || "未提供")}</span>
                      <span>测试重点：${escapeHtml(scenario.expected_test_focus || "未提供")}</span>
                      <span>${targets.map((target) => `<span class="coverage-chip">${escapeHtml(target)}</span>`).join(" ")}</span>
                    </span>
                  </label>
                `;
              }).join("")}
            </div>
            ${renderReviewPanel("scenarios", "人工校准入口", "可记录场景覆盖建议；修改勾选项会使运行结果和报告失效。", "重新生成测试场景")}
          </div>
        `;
      }

      function formatPercent(value) {
        if (value === null || value === undefined || value === "") return "N/A";
        const numeric = Number(value);
        if (Number.isNaN(numeric)) return escapeHtml(value);
        return `${numeric.toFixed(Number.isInteger(numeric) ? 0 : 1)}%`;
      }

      function scoreText(score, possibleScore) {
        const scoreValue = score ?? 0;
        if (possibleScore === null || possibleScore === undefined || possibleScore === "") {
          return `${scoreValue} 分`;
        }
        return `${scoreValue}/${possibleScore}`;
      }

      function verdictLabel(verdict) {
        const labels = {
          pass: "通过",
          fail: "失败",
          partial: "部分通过",
          needs_review: "需复核",
        };
        return labels[verdict] || verdict || "未判定";
      }

      function verdictClass(verdict) {
        if (verdict === "pass") return "verdict-pass";
        if (verdict === "fail") return "verdict-fail";
        if (verdict === "partial") return "verdict-partial";
        if (verdict === "needs_review") return "verdict-needs_review";
        return "";
      }

      function statusLabel(status) {
        const labels = {
          evaluated: "已评测",
          critical_failed: "严重失败",
          not_run: "未运行",
        };
        return labels[status] || status || "未知";
      }

      function statusClass(status) {
        if (status === "evaluated") return "status-evaluated";
        if (status === "critical_failed") return "status-critical_failed";
        if (status === "not_run") return "status-not_run";
        return "";
      }

      function renderDimensionBars(items) {
        if (!items || items.length === 0) {
          return `<p class="meta-text">暂无维度得分。</p>`;
        }
        return `
          <ul class="dimension-list">
            ${items.map((item) => {
              const possible = Number(item.possible_score || 0);
              const score = Number(item.score || 0);
              const passRate = possible ? Math.max(0, Math.min(100, Number(item.pass_rate ?? (score * 100 / possible)))) : 0;
              return `
                <li class="progress-row">
                  <span class="progress-label">${escapeHtml(item.dimension || "未命名维度")}</span>
                  <span class="progress-track" aria-label="${escapeHtml(item.dimension || "维度")} ${formatPercent(passRate)}">
                    <span class="progress-fill" style="width: ${passRate}%"></span>
                  </span>
                  <span class="progress-score">${escapeHtml(scoreText(item.score, item.possible_score))} · ${formatPercent(passRate)}</span>
                </li>
              `;
            }).join("")}
          </ul>
        `;
      }

      function renderScenarioMatrix(items) {
        if (!items || items.length === 0) {
          return `<p class="meta-text">暂无场景覆盖数据。</p>`;
        }
        return `
          <ul class="matrix-list">
            ${items.map((item) => `
              <li class="matrix-row">
                <div>
                  <div class="matrix-title">${escapeHtml(item.scenario_id || "scenario")}</div>
                  <span class="status-chip ${statusClass(item.status)}">${escapeHtml(statusLabel(item.status))}</span>
                </div>
                <div>
                  <div class="meta-text">测试重点：${escapeHtml(item.expected_test_focus || "未提供")}</div>
                  <div class="coverage-tags">
                    ${(item.coverage_targets || []).map((target) => `<span class="coverage-chip">${escapeHtml(target)}</span>`).join("")}
                  </div>
                </div>
                <div>
                  <span class="score-chip">${escapeHtml(scoreText(item.score, item.possible_score))}</span>
                  <div class="meta-text">严重失败：${escapeHtml((item.critical_failures || []).join("、") || "无")}</div>
                </div>
              </li>
            `).join("")}
          </ul>
        `;
      }

      function renderFailureSummary(items) {
        if (!items || items.length === 0) {
          return `<p class="meta-text">未发现失败项。</p>`;
        }
        return `
          <ul class="failure-list">
            ${items.map((item) => `
              <li class="failure-row">
                <div>
                  <div class="failure-title">${escapeHtml(item.scenario_id || "scenario")}</div>
                  <div class="meta-text">${escapeHtml(item.rubric_item_id || "rubric")}</div>
                </div>
                <div>
                  <div class="compact-row">
                    <span class="verdict-chip ${verdictClass(item.verdict)}">${escapeHtml(verdictLabel(item.verdict))}</span>
                    <span class="score-chip">${escapeHtml(scoreText(item.score, item.max_score))}</span>
                    <span class="meta-text">来源：${escapeHtml(item.source || "未提供")}</span>
                    <span class="meta-text">轮次：${escapeHtml(displayValue(item.turn_ids) || "未提供")}</span>
                  </div>
                  <p class="failure-reason">${escapeHtml(item.reason || "未提供失败原因")}</p>
                </div>
                <div>
                  <span class="status-chip ${item.severity === "critical" ? "status-critical_failed" : ""}">${escapeHtml(item.severity === "critical" ? "严重" : "普通")}</span>
                </div>
              </li>
            `).join("")}
          </ul>
        `;
      }

      function renderTrace(trace) {
        const turns = trace.turns || [];
        return `
          <div>
            <div class="trace-header">
              <div class="trace-title">${escapeHtml(trace.scenario_id || trace.id || "scenario")}</div>
              <span class="score-chip">${escapeHtml(trace.termination_reason || "未结束")}</span>
            </div>
            ${trace.error ? `<div class="error-banner">${escapeHtml(trace.error)}</div>` : ""}
            <ul class="turn-list">
              ${turns.map((turn, index) => `
                <li class="turn-row">
                  <div class="turn-meta">
                    <span class="turn-speaker">${escapeHtml(turn.speaker || "unknown")}</span>
                    <span class="turn-id">Turn ${escapeHtml(turn.turn_id ?? index + 1)}</span>
                  </div>
                  <p class="turn-content">${escapeHtml(turn.content || "")}</p>
                </li>
              `).join("") || `<li class="turn-row"><div class="turn-meta"><span class="turn-speaker">暂无轨迹</span></div><p class="turn-content">该场景没有返回对话轮次。</p></li>`}
            </ul>
          </div>
        `;
      }

      function renderResultEvidence(result) {
        if (!result) {
          return `<p class="meta-text">该轨迹暂无对应评测结果。</p>`;
        }
        const dimensions = Object.entries(result.dimension_scores || {});
        const evidence = result.evidence || [];
        return `
          <div>
            <div class="result-header">
              <div class="result-title">${escapeHtml(result.scenario_id || "scenario")}</div>
              <span class="score-chip">总分 ${escapeHtml(result.total_score ?? 0)}</span>
            </div>
            <div class="dimension-chip-list">
              ${dimensions.map(([dimension, score]) => `<span class="score-chip">${escapeHtml(dimension)} · ${escapeHtml(score)} 分</span>`).join("") || `<span class="meta-text">暂无维度分</span>`}
            </div>
            <div class="compact-row" style="margin-bottom: 10px">
              <span class="status-chip ${result.critical_failures?.length ? "status-critical_failed" : "status-evaluated"}">严重失败：${escapeHtml(displayValue(result.critical_failures) || "无")}</span>
            </div>
            <ul class="evidence-list">
              ${evidence.map((item) => renderEvidenceCard(item)).join("") || `<li class="evidence-card"><p class="evidence-text">暂无证据项。</p></li>`}
            </ul>
          </div>
        `;
      }

      function renderEvidenceCard(item) {
        return `
          <li class="evidence-card">
            <h3>${escapeHtml(item.rubric_item_id || "证据项")}</h3>
            <div class="compact-row" style="margin-bottom: 10px">
              <span class="verdict-chip ${verdictClass(item.verdict)}">${escapeHtml(verdictLabel(item.verdict))}</span>
              <span class="score-chip">${escapeHtml(scoreText(item.score, item.max_score))}</span>
            </div>
            <div class="evidence-fields">
              <div class="evidence-field">
                <strong>指令依据</strong>
                <p class="evidence-text">${escapeHtml(item.instruction_quote || "未提供")}</p>
              </div>
              <div class="evidence-field">
                <strong>预期行为</strong>
                <p class="evidence-text">${escapeHtml(item.expected_behavior || "未提供")}</p>
              </div>
              <div class="evidence-field">
                <strong>实际对话证据</strong>
                <p class="evidence-text">${escapeHtml(item.actual_behavior || "未提供")}</p>
              </div>
              <div class="evidence-field">
                <strong>判定解释</strong>
                <p class="evidence-text">${escapeHtml(item.explanation || item.reason || "未提供")}</p>
              </div>
            </div>
            <div class="evidence-meta">
              <span class="meta-text">turn_ids：${escapeHtml(displayValue(item.turn_ids) || "未提供")}</span>
              <span class="meta-text">reason：${escapeHtml(item.reason || "未提供")}</span>
              <span class="meta-text">source：${escapeHtml(item.source || "未提供")}</span>
            </div>
          </li>
        `;
      }

      function renderEvidenceChains(results) {
        const chains = (results || []).flatMap((result) =>
          (result.evidence || []).map((item) => ({...item, scenario_id: result.scenario_id}))
        );
        if (chains.length === 0) {
          return `<p class="meta-text">暂无证据链。</p>`;
        }
        return `
          <ul class="evidence-list">
            ${chains.map((item) => `
              <li class="evidence-card">
                <h3>${escapeHtml(item.scenario_id || "scenario")} · ${escapeHtml(item.rubric_item_id || "证据项")}</h3>
                <div class="compact-row" style="margin-bottom: 10px">
                  <span class="verdict-chip ${verdictClass(item.verdict)}">${escapeHtml(verdictLabel(item.verdict))}</span>
                  <span class="score-chip">${escapeHtml(scoreText(item.score, item.max_score))}</span>
                  <span class="meta-text">轮次：${escapeHtml(displayValue(item.turn_ids) || "未提供")}</span>
                </div>
                <div class="evidence-fields">
                  <div class="evidence-field"><strong>指令依据</strong><p class="evidence-text">${escapeHtml(item.instruction_quote || "未提供")}</p></div>
                  <div class="evidence-field"><strong>预期行为</strong><p class="evidence-text">${escapeHtml(item.expected_behavior || "未提供")}</p></div>
                  <div class="evidence-field"><strong>实际对话证据</strong><p class="evidence-text">${escapeHtml(item.actual_behavior || "未提供")}</p></div>
                  <div class="evidence-field"><strong>判定解释</strong><p class="evidence-text">${escapeHtml(item.explanation || item.reason || "未提供")}</p></div>
                </div>
                <div class="evidence-meta">
                  <span class="meta-text">reason：${escapeHtml(item.reason || "未提供")}</span>
                  <span class="meta-text">source：${escapeHtml(item.source || "未提供")}</span>
                </div>
              </li>
            `).join("")}
          </ul>
        `;
      }

      function renderRunResult(result) {
        const traces = result.traces || [];
        const results = result.results || [];
        const resultByScenario = new Map(results.map((item) => [item.scenario_id, item]));
        return `
          <div class="stage-panel">
            ${renderError()}
            <div class="stage-heading">
              <p class="eyebrow">Step 6 / 7 · ${stepLabels.run}</p>
              <h1>轨迹与结果</h1>
              <p>按场景对齐展示真实多轮轨迹与量化评测结果，便于从一次对话回溯到维度分、严重失败和证据判定。</p>
            </div>
            <div class="metric-grid">
              <div class="metric"><span>Run ID</span><strong>${escapeHtml(result.run_id || "N/A")}</strong></div>
              <div class="metric"><span>Trace Count</span><strong>${escapeHtml(result.trace_count ?? traces.length)}</strong></div>
              <div class="metric"><span>Result Count</span><strong>${escapeHtml(result.result_count ?? results.length)}</strong></div>
              <div class="metric"><span>Pass Rate</span><strong>${formatPercent(result.score_summary?.pass_rate ?? result.pass_rate)}</strong></div>
            </div>
            <div class="run-scenario-list">
              ${traces.map((trace) => {
                const scenarioId = trace.scenario_id || trace.id || "scenario";
                const scenarioResult = resultByScenario.get(scenarioId);
                const totalScore = scenarioResult?.total_score ?? 0;
                const failureText = displayValue(scenarioResult?.critical_failures) || "无严重失败";
                return `
                  <details class="scenario-accordion">
                    <summary>
                      <div class="result-summary-row">
                        <span class="result-summary-title">${escapeHtml(scenarioId)}</span>
                        <span class="score-chip">总分 ${escapeHtml(totalScore)}</span>
                        <span class="status-chip ${scenarioResult?.critical_failures?.length ? "status-critical_failed" : "status-evaluated"}">${escapeHtml(failureText)}</span>
                      </div>
                    </summary>
                    <div class="scenario-accordion-body">
                      <div class="scenario-pair">
                        ${renderTrace(trace)}
                        ${renderResultEvidence(scenarioResult)}
                      </div>
                    </div>
                  </details>
                `;
              }).join("") || `<section class="scenario-report-panel"><p class="meta-text">暂无运行轨迹。</p></section>`}
            </div>
            ${renderReviewPanel("run", "复核与重跑入口", "对话轨迹和评分证据不可直接编辑；如模型、场景或评测逻辑需要调整，应重新运行评测。", "重新运行评测")}
          </div>
        `;
      }

      function renderReport(result) {
        const scoreSummary = result.score_summary || {};
        const summary = result.report || result.summary || "暂无报告内容。";
        return `
          <div class="stage-panel">
            ${renderError()}
            <div class="stage-heading">
              <p class="eyebrow">Step 7 / 7 · ${stepLabels.report}</p>
              <h1>最终可视化结果报告</h1>
              <p>汇总总分、通过率、场景覆盖、失败项和证据链，形成可复盘的量化视觉报告。</p>
            </div>
            <div class="metric-grid">
              <div class="metric"><span>总分</span><strong>${escapeHtml(scoreText(scoreSummary.total_score, scoreSummary.possible_score))}</strong></div>
              <div class="metric"><span>通过率</span><strong>${formatPercent(scoreSummary.pass_rate)}</strong></div>
              <div class="metric"><span>场景数</span><strong>${escapeHtml(scoreSummary.scenario_count ?? result.result_count ?? 0)}</strong></div>
              <div class="metric"><span>严重失败</span><strong>${escapeHtml(scoreSummary.critical_failure_count ?? 0)}</strong></div>
            </div>
            <div class="report-grid">
              <section class="report-section">
                <h2>维度得分</h2>
                ${renderDimensionBars(result.dimension_summary || [])}
              </section>
              <section class="report-section">
                <h2>失败项摘要</h2>
                ${renderFailureSummary(result.failure_summary || [])}
              </section>
            </div>
            <div class="report-stack">
              <section class="report-section">
                <h2>场景覆盖矩阵</h2>
                ${renderScenarioMatrix(result.scenario_summary || [])}
              </section>
              <details class="report-details">
                <summary>证据链</summary>
                ${renderEvidenceChains(result.results || [])}
              </details>
            </div>
            <details class="report-details">
              <summary>Markdown 报告预览</summary>
              <div class="markdown-report" style="margin-top: 12px">${escapeHtml(summary)}</div>
            </details>
            ${renderReviewPanel("report", "人工复核备注", "最终报告分数不可直接修改；可记录专家复核意见，生产环境应保存为 HumanReviewNote。", "刷新报告视图")}
          </div>
        `;
      }

      function renderParseStep() {
        const spec = state.parseResult?.task_spec;
        stageRoot.innerHTML = spec ? renderTaskSpec(spec) : renderEmptyStage("指令解析", "点击生成后解析任务目标、流程、约束、FAQ 和异常分支。");
      }

      function renderRubricStep() {
        const rubric = state.rubricResult?.rubric_spec;
        stageRoot.innerHTML = rubric ? renderRubric(rubric) : renderEmptyStage("Rubric 生成", "点击生成后生成评分项、权重、判定方式和证据来源。");
      }

      function renderScenariosStep() {
        const scenarios = state.scenarioResult?.scenario_set?.scenarios || [];
        stageRoot.innerHTML = scenarios.length ? renderScenarios(scenarios) : renderEmptyStage("测试场景", "点击生成后生成覆盖拒绝、忙碌、追问、退出、超范围等分支的用户模拟场景。");
        document.querySelectorAll("[data-scenario-id]").forEach((checkbox) => {
          checkbox.addEventListener("change", (event) => {
            const id = event.target.dataset.scenarioId;
            if (event.target.checked) state.selectedScenarioIds.add(id);
            else state.selectedScenarioIds.delete(id);
            invalidateFrom("run");
          });
        });
      }

      function renderRunStep() {
        stageRoot.innerHTML = state.runResult ? renderRunResult(state.runResult) : renderEmptyStage("轨迹与结果", "点击运行后展示每个场景的多轮对话轨迹、得分和失败证据。");
      }

      function renderReportStep() {
        stageRoot.innerHTML = state.runResult ? renderReport(state.runResult) : renderEmptyStage("可视化报告", "完成运行后生成量化总览、维度得分、覆盖矩阵和证据链报告。");
      }

      function renderStep() {
        if (state.activeStep === "model") renderModelStep();
        if (state.activeStep === "data") renderDataStep();
        if (state.activeStep === "parse") renderParseStep();
        if (state.activeStep === "rubric") renderRubricStep();
        if (state.activeStep === "scenarios") renderScenariosStep();
        if (state.activeStep === "run") renderRunStep();
        if (state.activeStep === "report") renderReportStep();
        wireReviewControls();
      }

      async function handleNext() {
        try {
          validateCurrentStep();
          const active = state.activeStep;
          if (active !== "report" && state.generatedSteps.has(active)) {
            if (active === "model") readModelForm();
            if (active === "data") readDataForm();
            saveCalibrationNote(active);
            completeStep(active);
            return;
          }
          setRunning(true);
          if (active === "model") {
            readModelForm();
            markStepGenerated("model");
            return;
          }
          if (active === "data") {
            readDataForm();
            markStepGenerated("data");
            return;
          }
          if (active === "parse") {
            await executeParseStage();
            markStepGenerated("parse");
            return;
          }
          if (active === "rubric") {
            await executeRubricStage();
            markStepGenerated("rubric");
            return;
          }
          if (active === "scenarios") {
            await executeScenariosStage();
            markStepGenerated("scenarios");
            return;
          }
          if (active === "run") {
            await executeRunStage();
            markStepGenerated("run");
            return;
          }
          if (active === "report") renderReportStep();
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        } finally {
          setRunning(false);
        }
      }

      function handlePrevious() {
        const previous = steps[stepIndex(state.activeStep) - 1];
        if (previous && canOpenStep(previous)) setActiveStep(previous);
      }

      document.querySelectorAll(".step-item").forEach((button) => {
        button.addEventListener("click", () => moveToStep(button.dataset.step));
      });
      globalNavItems.forEach((button) => {
        button.addEventListener("click", () => switchView(button.dataset.globalView));
      });
      navToggle.addEventListener("click", () => {
        state.sidebarCollapsed = !state.sidebarCollapsed;
        renderShell();
      });
      prevButton.addEventListener("click", handlePrevious);
      nextButton.addEventListener("click", handleNext);

      loadContext().then(() => {
        renderShell();
        renderHome();
      });
    </script>
  </body>
</html>
